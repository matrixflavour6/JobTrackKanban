<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrack Ledger</title>
    <meta name="description" content="A private, local-first job search ledger — Kanban board, flow analytics, offer comparison, ATS keyword matching, and optional Google Drive/Gmail sync. Nothing leaves your browser unless you say so." />
    <!--
      Content-Security-Policy — GitHub Pages can't set real HTTP headers, so
      this meta tag is the only enforcement mechanism available here. It's
      intentionally scoped to exactly what this app calls: itself, Google's
      Sign-In script/APIs (Drive + Gmail sync), and Google Fonts. Nothing
      else can load or execute, which meaningfully limits what an injected
      script (e.g. via a supply-chain issue in a dependency) could reach.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https://*.googleusercontent.com;
      connect-src 'self' https://www.googleapis.com https://gmail.googleapis.com https://oauth2.googleapis.com https://accounts.google.com;
      frame-src https://accounts.google.com;
      object-src 'none';
      base-uri 'self';
    " />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
